<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f5f2"><title>枳 × 夏彥｜約稿圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f2;--paper:#fff;--ink:#343330;--muted:#89857e;--line:#e9e5df;--accent:#9b7882;--soft:#f2ecee;--shadow:0 10px 35px #473d3510}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{padding:25px clamp(18px,5vw,64px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#ffffffb8}.brand{font-size:18px;font-weight:700;letter-spacing:.08em}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.18em;margin-top:4px}.top-actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 14px;color:var(--ink)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.hero{max-width:1200px;margin:42px auto 26px;padding:0 24px}.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--accent);font-weight:700}.hero h1{font-size:clamp(27px,4vw,42px);font-weight:500;margin:10px 0}.hero p{color:var(--muted);font-size:14px;margin:0}.layout{max-width:1200px;margin:auto;padding:0 24px 70px;display:grid;grid-template-columns:230px 1fr;gap:28px}.sidebar,.content{background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.sidebar{padding:18px;height:max-content}.side-title{font-size:11px;color:var(--muted);letter-spacing:.14em;margin:4px 8px 12px}.folder{width:100%;border:0;background:transparent;text-align:left;padding:11px 10px;border-radius:10px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;font-size:14px}.folder:hover,.folder.active{background:var(--soft);color:var(--accent)}.folder .count{font-size:11px;color:var(--muted)}.subfolders{padding-left:17px}.subfolders .folder{font-size:13px;padding:8px 10px}.content{padding:24px;min-height:460px}.content-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.content-head h2{font-size:20px;font-weight:500;margin:0}.content-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.tools{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:white}.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f0eeeb;display:block;cursor:zoom-in}.placeholder{aspect-ratio:4/3;display:grid;place-items:center;color:#aaa;background:linear-gradient(135deg,#f4f0ed,#ebe6e2);font-size:13px}.meta{padding:12px 13px}.meta strong{font-size:14px;font-weight:600;display:block;margin-bottom:8px}.meta span{display:block;color:var(--muted);font-size:12px;line-height:1.8}.empty{padding:65px 15px;text-align:center;color:var(--muted);font-size:14px}.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:7px}.modal{position:fixed;inset:0;background:#24211f88;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.dialog{background:white;border-radius:16px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto}.dialog h3{margin:0 0 17px;font-size:18px;font-weight:600}.field{display:block;margin:12px 0}.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.field textarea{min-height:75px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.viewer{max-width:min(1000px,95vw);max-height:90vh}.viewer img{max-width:100%;max-height:78vh;object-fit:contain;display:block;border-radius:8px}.notice{font-size:12px;color:var(--muted);line-height:1.7;margin-top:16px}.hidden{display:none!important}.adminbar{background:#f6f0f2;border:1px solid #eadde1;padding:10px 13px;border-radius:10px;font-size:12px;color:#795d67;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.mobile-folder{display:none}
@media(max-width:800px){.layout{grid-template-columns:1fr;gap:14px}.sidebar{padding:12px}.side-title{margin-bottom:7px}.folder-list{display:flex;gap:6px;flex-wrap:wrap}.folder{width:auto;padding:9px 12px}.subfolders{display:flex;padding:0;gap:5px;flex-wrap:wrap}.subfolders .folder{font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:17px}.hero{margin-top:30px}.top{padding:18px}.brand{font-size:15px}}@media(max-width:430px){.grid{gap:10px}.meta{padding:9px}.meta strong{font-size:12px}.meta span{font-size:11px}.content-head{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<header class="top"><div class="brand">枳 × 夏彥 <small>COMMISSION ARCHIVE · 約稿圖鑑</small></div><div class="top-actions"><button class="btn" id="loginBtn">管理者登入</button><button class="btn hidden" id="logoutBtn">登出</button></div></header>
<section class="hero"><div class="eyebrow">A LITTLE GALLERY OF MEMORIES</div><h1>把每一份喜歡，好好收藏。</h1><p>個人約稿收藏・依資料夾整理・持續更新中</p></section>
<main class="layout"><aside class="sidebar"><div class="side-title">COLLECTIONS / 收藏分類</div><div id="folderNav"></div><div class="notice">此網站提供公開閱覽。只有管理者登入後可以新增、編輯或刪除內容。</div></aside>
<section class="content"><div id="adminBar" class="adminbar hidden"><span>管理模式已開啟｜你可以管理資料夾與圖片</span><button class="btn primary" id="newFolder">＋ 新增資料夾</button></div><div class="content-head"><div><h2 id="currentTitle">全部收藏</h2><p id="currentDesc">慢慢收集，慢慢整理。</p></div><div class="tools hidden" id="adminTools"><button class="btn primary" id="uploadBtn">＋ 新增圖片</button></div></div><div class="grid" id="gallery"></div><div class="empty hidden" id="empty"><b>這裡還沒有收藏</b>可以在管理模式中新增圖片，或建立子資料夾。</div></section></main>
<div class="modal" id="modal"><div class="dialog"><h3 id="modalTitle">管理</h3><div id="modalBody"></div><div class="dialog-actions"><button class="btn" id="cancelModal">取消</button><button class="btn primary" id="saveModal">儲存</button></div></div></div>
<div class="modal" id="imageModal"><div class="viewer"><img id="largeImage" alt="約稿圖片"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// 先完成 Supabase 專案設定，再把網址與 anon key 填在下方。未設定時網站會顯示設定提示，不會假裝資料已經雲端保存。
const SUPABASE_URL='YOUR_SUPABASE_PROJECT_URL'; const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&!SUPABASE_ANON_KEY.includes('YOUR_');
const db=configured?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let user=null,folders=[],artworks=[],selectedFolder=null,modalAction=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){if(!configured){$('empty').classList.remove('hidden');$('empty').innerHTML='<b>網站尚待連接雲端資料庫</b>完成 Supabase 設定後，這裡就會顯示你的收藏。';$('loginBtn').disabled=true;$('loginBtn').title='請先完成雲端設定';return}const {data:{user:u}}=await db.auth.getUser();user=u;db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;renderAuth();load()});renderAuth();await load()}
function renderAuth(){$('loginBtn').classList.toggle('hidden',!!user);$('logoutBtn').classList.toggle('hidden',!user);$('adminBar').classList.toggle('hidden',!user);$('adminTools').classList.toggle('hidden',!user)}
async function load(){if(!db)return;const [f,a]=await Promise.all([db.from('folders').select('*').order('created_at'),db.from('artworks').select('*').order('created_at',{ascending:false})]);if(f.error||a.error){$('empty').classList.remove('hidden');$('empty').innerHTML='<b>讀取資料時發生問題</b>'+esc(f.error?.message||a.error?.message);return}folders=f.data||[];artworks=a.data||[];if(selectedFolder&&!folders.some(x=>x.id===selectedFolder))selectedFolder=null;render()}
function children(parent){return folders.filter(f=>f.parent_id===parent)}function folderName(id){return folders.find(f=>f.id===id)?.name||'未分類'}
function render(){const roots=children(null);$('folderNav').innerHTML='<button class="folder '+(!selectedFolder?'active':'')+'" data-id="">✧ 全部收藏 <span class="count">'+artworks.length+'</span></button>'+roots.map(f=>`<button class="folder ${selectedFolder===f.id?'active':''}" data-id="${f.id}">▱ ${esc(f.name)} <span class="count">${artworks.filter(a=>a.folder_id===f.id).length}</span></button><div class="subfolders">${children(f.id).map(s=>`<button class="folder ${selectedFolder===s.id?'active':''}" data-id="${s.id}">↳ ${esc(s.name)}</button>`).join('')}</div>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selectedFolder=b.dataset.id||null;render()});let list=artworks.filter(a=>!selectedFolder||a.folder_id===selectedFolder);$('currentTitle').textContent=selectedFolder?folderName(selectedFolder):'全部收藏';$('currentDesc').textContent=selectedFolder?'收藏於「'+folderName(selectedFolder)+'」':'慢慢收集，慢慢整理。';$('gallery').innerHTML=list.map(a=>`<article class="card"><img class="thumb" src="${esc(a.image_url)}" alt="${esc(a.title)}" data-image="${esc(a.image_url)}"><div class="meta"><strong>${esc(a.title||'未命名作品')}</strong><span>繪師｜${esc(a.artist||'未填寫')}</span><span>完成｜${esc(a.completed_month||'未填寫')}</span>${a.note?`<span>${esc(a.note)}</span>`:''}${user?`<div style="display:flex;gap:7px;margin-top:9px"><button class="btn" data-edit="${a.id}">編輯</button><button class="btn" data-delete="${a.id}">刪除</button></div>`:''}</div></article>`).join('');$('empty').classList.toggle('hidden',list.length>0);if(!list.length)$('empty').innerHTML='<b>這裡還沒有收藏</b>'+(user?'使用右上方的管理功能新增圖片或資料夾。':'收藏內容尚未上架。');document.querySelectorAll('[data-image]').forEach(i=>i.onclick=()=>{$('largeImage').src=i.dataset.image;$('imageModal').classList.add('show')});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editArtwork(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteArtwork(b.dataset.delete))}
function openModal(title,html,action){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;modalAction=action;$('modal').classList.add('show')}$('cancelModal').onclick=()=>$('modal').classList.remove('show');$('imageModal').onclick=()=>$('imageModal').classList.remove('show');$('saveModal').onclick=async()=>{if(modalAction)await modalAction()};
$('loginBtn').onclick=()=>openModal('管理者登入',`<label class="field"><span>Email</span><input id="email" type="email" autocomplete="username"></label><label class="field"><span>密碼</span><input id="password" type="password" autocomplete="current-password"></label><p class="notice">管理者帳號需先在 Supabase Auth 中建立。</p>`,async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)alert(error.message);else $('modal').classList.remove('show')});$('logoutBtn').onclick=async()=>{await db.auth.signOut()};
$('newFolder').onclick=()=>openModal('新增資料夾',`<label class="field"><span>資料夾名稱</span><input id="folderName" placeholder="例如：日常、紀念日"></label><label class="field"><span>建立於</span><select id="parentFolder" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:9px"><option value="">主資料夾</option>${folders.map(f=>`<option value="${f.id}" ${f.id===selectedFolder?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label>`,async()=>{const name=$('folderName').value.trim();if(!name)return alert('請輸入資料夾名稱');const {error}=await db.from('folders').insert({name,parent_id:$('parentFolder').value||null});if(error)alert(error.message);else{$('modal').classList.remove('show');await load()}});
$('uploadBtn').onclick=()=>openModal('新增約稿圖片',`<label class="field"><span>選擇圖片</span><input id="photo" type="file" accept="image/*"></label><label class="field"><span>作品名稱</span><input id="title" placeholder="例如：春日約會"></label><label class="field"><span>繪師名稱</span><input id="artist" placeholder="繪師名稱"></label><label class="field"><span>完成日期（西元年／月）</span><input id="month" type="month"></label><label class="field"><span>資料夾</span><select id="artFolder" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:9px">${folders.map(f=>`<option value="${f.id}" ${f.id===selectedFolder?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><label class="field"><span>備註（選填）</span><textarea id="note"></textarea></label>`,async()=>{const file=$('photo').files[0];if(!file)return alert('請選擇圖片');const path=`${user.id}/${Date.now()}-${file.name.replace(/[^\w.\-]/g,'_')}`;const up=await db.storage.from('commission-images').upload(path,file);if(up.error)return alert(up.error.message);const {data}=db.storage.from('commission-images').getPublicUrl(path);const ins=await db.from('artworks').insert({title:$('title').value,artist:$('artist').value,completed_month:$('month').value,folder_id:$('artFolder').value||null,note:$('note').value,image_url:data.publicUrl,storage_path:path});if(ins.error)alert(ins.error.message);else{$('modal').classList.remove('show');await load()}});
async function editArtwork(id){const a=artworks.find(x=>x.id===id);openModal('編輯作品資訊',`<label class="field"><span>作品名稱</span><input id="title" value="${esc(a.title)}"></label><label class="field"><span>繪師名稱</span><input id="artist" value="${esc(a.artist)}"></label><label class="field"><span>完成日期（西元年／月）</span><input id="month" type="month" value="${esc(a.completed_month)}"></label><label class="field"><span>備註</span><textarea id="note">${esc(a.note)}</textarea></label>`,async()=>{const {error}=await db.from('artworks').update({title:$('title').value,artist:$('artist').value,completed_month:$('month').value,note:$('note').value}).eq('id',id);if(error)alert(error.message);else{$('modal').classList.remove('show');await load()}})}
async function deleteArtwork(id){if(!confirm('確定刪除這張圖片嗎？'))return;const a=artworks.find(x=>x.id===id);const {error}=await db.from('artworks').delete().eq('id',id);if(error)return alert(error.message);if(a.storage_path)await db.storage.from('commission-images').remove([a.storage_path]);await load()}
init();
</script></body></html>
